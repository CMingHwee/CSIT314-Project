<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create User Account · IDP Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-area="admin" data-nav="create-account" data-tables="user_accounts,activity_log">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="page-header">
      <div>
        <div class="breadcrumb">User Management / Create Account</div>
        <h1>Create User Account</h1>
      </div>
      <div class="user-chip" id="user-chip"></div>
    </header>

    <div id="page-banner"></div>

    <div id="page-content">
      <!-- Create User Account -->
      <form class="card" id="create-account-form" novalidate>
        <p class="section-label">Account details</p>

        <div class="grid-2">
          <div class="field" data-field="username">
            <label for="username">Username *</label>
            <input id="username" name="username" autocomplete="off">
            <span class="field-error"></span>
          </div>

          <div class="field" data-field="email">
            <label for="email">Email *</label>
            <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="off">
            <span class="field-error"></span>
          </div>

          <div class="field" data-field="phone">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" inputmode="numeric" placeholder="9xxx xxxx">
            <span class="field-error"></span>
          </div>

          <div class="field" data-field="role">
            <label for="role">Role *</label>
            <select id="role" name="role"></select>
            <span class="field-error"></span>
          </div>

          <div class="field span-2 w-wide" data-field="password">
            <label for="password">Password *</label>
            <input id="password" name="password" type="password" autocomplete="new-password">
            <span class="field-error"></span>
            <span class="hint">At least 8 characters, including a number and a symbol.</span>
          </div>
        </div>

        <div class="actions">
          <a class="btn btn-secondary" href="user-accounts.html">Cancel</a>
          <button class="btn btn-primary" type="submit">Create Account</button>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="js/data/CsvStore.js"></script>
<script src="js/util/validation.js"></script>
<script src="js/entity/UserAccount.js"></script>
<script src="js/util/session.js"></script>
<script src="js/entity/ActivityLog.js"></script>
<script src="js/controller/CreateUserAccountController.js"></script>
<script src="js/controller/UserAdminLogoutController.js"></script>
<script src="js/boundary/ui.js"></script>
<script src="js/boundary/UserAdminLogoutPage.js"></script>
<script src="js/boundary/Layout.js"></script>
<script src="js/boundary/CreateUserAccountPage.js"></script>
</body>
</html>
