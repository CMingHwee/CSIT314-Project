<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search User Accounts · IDP Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-area="admin" data-nav="search-accounts" data-tables="user_accounts">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="page-header">
      <div>
        <div class="breadcrumb">User Management / Search Accounts</div>
        <h1>Search User Accounts</h1>
      </div>
      <div class="user-chip" id="user-chip"></div>
    </header>

    <div id="page-banner"></div>

    <div id="page-content">
      <!-- Search User Accounts -->
      <form class="card" id="search-form" novalidate role="search">
        <div class="search-row">
          <div class="field field-by" data-field="field">
            <label for="field">Search by</label>
            <select id="field" name="field"></select>
          </div>
          <div class="field field-term" data-field="term">
            <label for="term">Search term</label>
            <input id="term" name="term" placeholder="Username, email or role" autocomplete="off">
            <span class="field-error"></span>
          </div>
          <button class="btn btn-primary btn-small" type="submit">Search</button>
        </div>
      </form>

      <section class="card" id="results-card" hidden aria-live="polite">
        <div class="card-head">
          <p class="section-label" id="results-title"></p>
          <button class="btn btn-secondary btn-small" type="button" id="clear-btn">Clear search</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
                <th>Status</th>
                <th><span class="visually-hidden">Action</span></th>
              </tr>
            </thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="js/data/CsvStore.js"></script>
<script src="js/util/validation.js"></script>
<script src="js/util/session.js"></script>
<script src="js/entity/UserAccount.js"></script>
<script src="js/controller/SearchUserAccountController.js"></script>
<script src="js/controller/UserAdminLogoutController.js"></script>
<script src="js/boundary/ui.js"></script>
<script src="js/boundary/UserAdminLogoutPage.js"></script>
<script src="js/boundary/Layout.js"></script>
<script src="js/boundary/SearchUserAccountPage.js"></script>
</body>
</html>
