<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Current Project · IDP Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-area="designer" data-nav="my-projects" data-tables="user_accounts,companies,projects,activity_log,categories">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="page-header">
      <div>
        <div class="breadcrumb"><a href="my-projects.html">My Projects</a> / Create New Current Project</div>
        <h1>Create Current Project (IDP)</h1>
      </div>
      <div class="user-chip" id="user-chip"></div>
    </header>

    <div id="page-banner"></div>

    <div id="page-content">
      <!-- Create Current IDP -->
      <form class="card" id="project-form" novalidate hidden>
        <p class="section-label">Project details</p>
        <div class="grid-2">
          <div class="field" data-field="projectName">
            <label for="projectName">Project Name *</label>
            <input id="projectName" name="projectName" placeholder="e.g. Tampines 4-room HDB renovation" autocomplete="off">
            <span class="field-error"></span>
          </div>

          <div class="field" data-field="customerName">
            <label for="customerName">Customer Name *</label>
            <input id="customerName" name="customerName" autocomplete="off">
            <span class="field-error"></span>
          </div>

          <div class="field" data-field="startDate">
            <label for="startDate">Start Date *</label>
            <input id="startDate" name="startDate" type="date">
            <span class="field-error"></span>
          </div>

          <div class="field">
            <label for="status">Status</label>
            <input id="status" value="Current" readonly tabindex="-1">
            <span class="hint">Set automatically by the system.</span>
          </div>

          <div class="field" data-field="categoryId">
            <label for="categoryId">Category</label>
            <select id="categoryId" name="categoryId"></select>
            <span class="field-error"></span>
            <span class="hint">Optional. Helps customers find similar projects.</span>
          </div>

          <div class="field span-2" data-field="description">
            <label for="description">Description *</label>
            <textarea id="description" name="description" placeholder="Scope, rooms, style, budget notes…"></textarea>
            <span class="field-error"></span>
          </div>
        </div>

        <div class="actions">
          <a class="btn btn-secondary" href="my-projects.html">Cancel</a>
          <button class="btn btn-primary" type="submit">Save</button>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="js/data/CsvStore.js"></script>
<script src="js/util/validation.js"></script>
<script src="js/util/session.js"></script>
<script src="js/entity/UserAccount.js"></script>
<script src="js/entity/CompanyInfo.js"></script>
<script src="js/entity/Project.js"></script>
<script src="js/entity/Category.js"></script>
<script src="js/entity/ActivityLog.js"></script>
<script src="js/controller/CreateCurrentProjectController.js"></script>
<script src="js/controller/LogoutController.js"></script>
<script src="js/boundary/ui.js"></script>
<script src="js/boundary/LogoutPage.js"></script>
<script src="js/boundary/Layout.js"></script>
<script src="js/boundary/CreateCurrentProjectPage.js"></script>
</body>
</html>
